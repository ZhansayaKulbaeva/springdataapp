<html lang="en" layout:decorate="layout/main.html" xmlns:layout="http://www.w3.org/1999/xhtml">
<div layout:fragment="mainFragment">
    <div>
        <div class="container" style="min-height: 500px;">

            <form th:action="@{/updateCourse}" method="post" th:object="${course}" class="form-control">
                <input type="hidden" th:field="*{id}">
                <label>NAME:</label>
                <input type="text" th:field="*{name}" class="form-control" required>

                <label>PRICE:</label>
                <input type="number" th:field="*{price}" class="form-control" required>

                <label>DESCRIPTION:</label>
                <textarea th:field="*{description}" cols="50" rows="5" class="form-control" required></textarea>
                <div class="row mt-3">
                    <div class="col-12">
                        <button class="btn btn-success">SUBMIT</button>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-12">
                        <a th:href="@{'/deleteCourse/' + ${course.getId()}}" class="btn btn-danger">DELETE</a>
                    </div>
                </div>
            </form>


        </div>
    </div>
</div>
</html>
