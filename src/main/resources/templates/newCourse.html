<html lang="en" layout:decorate="layout/main.html" xmlns:layout="http://www.w3.org/1999/xhtml">
<div layout:fragment="mainFragment">
  <div>
    <br><br>
    <table class="table table-striped">
      <thead>
        <tr>
            <th>ID</th>
            <th>NAME</th>
            <th>PRICE</th>
            <th width="10%">DETAILS</th>
        </tr>
      </thead>
      <tbody>
      <tr th:each="course:${courses}">
        <td th:text="${course.getId()}"></td>
        <td th:text="${course.getName()}"></td>
        <td th:text="${course.getPrice()}"></td>
        <td>
          <a th:href="@{'/detailsCourse/' + ${course.getId()}}" class="btn btn-success">DETAILS</a>
        </td>
      </tr>
      </tbody>
    </table>
    <div class="container" style="min-height: 500px;">
      <div class="row mt-3">
        <div class="col-6 mx-auto">
          <form th:action="@{'/addCourse'}" method="post">
            <div class="row">
              <div class="col-12">
                <label>NAME:</label>
              </div>
            </div>
            <div class="row mt-2">
              <div class="col-12">
                <input type="text" class="form-control" required placeholder="Course Name" name="name">
              </div>
            </div>
            <div class="row mt-3">
              <div class="col-12">
                <label>PRICE:</label>
              </div>
            </div>
            <div class="row mt-2">
              <div class="col-12">
                <input type="number" class="form-control" required placeholder="50000" name="price">
              </div>
            </div>
            <div class="row mt-3">
              <div class="col-12">
                <label>DESCRIPTION:</label>
              </div>
            </div>
            <div class="row mt-2">
              <div class="col-12">
                <textarea class="form-control" name="desc"></textarea>
              </div>
            </div>
            <div class="row mt-3">
              <div class="col-12">
                <button class="btn btn-success">SUBMIT</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</html>
